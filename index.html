    body {

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      width: 100%;
      max-width: 600px;
      margin: 1rem auto;
      transition: all 0.3s ease;
    }
    .admin-container {
      max-width: 900px;
    }
    .btn {
      transition: transform 0.2s ease, background-color 0.3s ease;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-weight: bold;
      width: 100%;
      text-align: center;
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
    .input, select {
      border: 2px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 0.75rem;
      width: 100%;
      transition: border-color 0.3s ease;
    }
    .input:focus, select:focus {
      border-color: #3b82f6;
      outline: none;
    }
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-message {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      text-align: center;
    }
    #chat-history {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 0.75rem;
      word-wrap: break-word;
    }
    #chat-history > div {
      margin-bottom: 1rem;
    }
    #chat-history p {
      margin: 0.5rem 0;
    }
    #progress-chart, #admin-progress-chart {
      max-height: 300px;
      width: 100%;
    }

      }

      }
      .input, select {

      }

  function showSection(sectionId) {

    const section = document.getElementById(sectionId);

    if (logoutBtn) {

      setTimeout(() => MathJax.typesetPromise().catch(err => console.error("MathJax error:", err)), 100);
    }
  }

  function sanitizeLatex(text) {
    if (!text) return "";
    return text
      .replace(/\\{2,}/g, '\\')
      .replace(/\\\(.*?\\\)/g, match => match.replace(/\s+/g, ' ').trim())
      .replace(/\\\[.*?\\\]/g, match => match.replace(/\s+/g, ' ').trim())
      .replace(/\\([a-zA-Z]+)/g, (match, cmd) => {
        const validCommands = ['frac', 'sqrt', 'sum', 'int', 'sin', 'cos', 'tan', 'log', 'ln', 'lim'];
        return validCommands.includes(cmd) ? match : `\\text{${cmd}}`;
      })
      .replace(/[^\x20-\x7E\\{}\[\]()^_+\-*/=<>|]/g, '')
      .replace(/\\([{}])/g, '$1');
  }

  function preprocessJsonText(text) {
    return text
      .replace(/\\{2,}/g, '\\')
      .replace(/([^\\])"/g, '$1\\"')
      .replace(/\\([^\\bfnrtu])/g, '$1')
      .replace(/\n/g, '\\n')
      .replace(/\t/g, '\\t');
  }

  let questionCache = new Map();
  async function generateQuestion(grade, chapterId, difficulty, retries = 10, baseDelay = 1000) {
    showLoading(true);
    const topic = topics[grade][chapterId][Math.floor(Math.random() * topics[grade][chapterId].length)];
    const cacheKey = `${grade}-${chapterId}-${difficulty}-${topic}`;

    // بررسی کش
    if (questionCache.has(cacheKey) && questionCache.get(cacheKey).length > 0) {
      const cachedQuestions = questionCache.get(cacheKey);
      showLoading(false);
      return cachedQuestions.shift();
    }

    // بررسی سؤالات آفلاین
    if (offlineQuestions[grade]?.[chapterId]?.length > 0) {
      const offline = offlineQuestions[grade][chapterId].filter(q => q.difficulty === difficulty);
      if (offline.length > 0) {
        const question = offline[Math.floor(Math.random() * offline.length)];
        if (!questionCache.has(cacheKey)) {
          questionCache.set(cacheKey, []);
        }
        questionCache.get(cacheKey).push({ ...question });
        showLoading(false);
        return question;
      }
    }

    // بررسی سؤالات ذخیره‌شده در Firestore
    try {
      const q = query(collection(db, "questions"), where("grade", "==", grade), where("chapterId", "==", chapterId), where("difficulty", "==", difficulty));
      const snapshot = await getDocs(q);
      if (!snapshot.empty) {
        const questions = snapshot.docs.map(doc => doc.data());
        const question = questions[Math.floor(Math.random() * questions.length)];
        if (!questionCache.has(cacheKey)) {
          questionCache.set(cacheKey, []);
        }
        questionCache.get(cacheKey).push({ ...question });
        showLoading(false);
        return question;
      }
    } catch (error) {
      console.error("خطا در بررسی سؤالات Firestore:", error.message);
    }

    const prompt = `
      Generate a unique math question in Persian for grade ${grade}, chapter "${chapters[grade].find(c => c.id == chapterId).name}", topic "${topic}", difficulty ${difficulty} (1=easy, 2=medium, 3=hard).
      Return a valid JSON object with:
      - "question": Persian text with LaTeX for math (use \\( and \\))
      - "correctAnswer": string or number
      - "options": array of 4 unique strings or numbers (no LaTeX)
      Ensure the correct answer is in options, JSON is valid, and LaTeX is correct.
      Example:
      {
        "question": "حل کنید: \\(2x + 3 = 7\\). مقدار \\(x\\) چیست؟",
        "correctAnswer": "2",
        "options": ["1", "2", "3", "4"]
      }
    `;

    for (let attempt = 1; attempt <= retries; attempt++) {
      try {
        const response = await openai.chat.completions.create({
          model: 'gpt-4o',
          messages: [
            { role: 'system', content: 'You are a math question generator that provides valid JSON responses in Persian.' },
            { role: 'user', content: prompt }
          ]
        });
        const rawText = response.choices[0].message.content.replace(/```json\n|\n```/g, '');
        const processedText = preprocessJsonText(rawText);
        let result;
        try {
          result = JSON.parse(processedText);
        } catch (parseError) {
          console.error(`تلاش ${attempt} برای تولید سؤال ناموفق بود: JSON.parse error:`, parseError.message);
          throw parseError;
        }
        if (!result.question || !result.correctAnswer || !Array.isArray(result.options) || result.options.length !== 4 || !result.options.every(opt => typeof opt === 'string' || typeof opt === 'number') || !result.options.includes(result.correctAnswer)) {
          throw new Error("فرمت سؤال نامعتبر است");
        }
        const question = {
          text: sanitizeLatex(result.question),
          correctAnswer: String(result.correctAnswer),
          options: result.options.map(String),
          topic,
          difficulty,
          grade,
          chapterId
        };
        // ذخیره سؤال در Firestore
        try {
          await addDoc(collection(db, "questions"), question);
        } catch (error) {
          console.error("خطا در ذخیره سؤال در Firestore:", error.message);
        }
        if (!questionCache.has(cacheKey)) {
          questionCache.set(cacheKey, []);
        }
        questionCache.get(cacheKey).push({ ...question });
        showLoading(false);
        return question;
      } catch (error) {
        console.error(`تلاش ${attempt} برای تولید سؤال ناموفق بود:`, error.message);
        if (attempt === retries) {
          const fallbackQuestion = {
            text: `حل کنید: \\(${difficulty}x + ${difficulty} = ${difficulty * 2}\\). مقدار \\(x\\) چیست؟`,
            correctAnswer: "1",
            options: ["0", "1", "2", "3"],
            topic,
            difficulty,
            grade,
            chapterId
          };
          if (!questionCache.has(cacheKey)) {
            questionCache.set(cacheKey, []);
          }
          questionCache.get(cacheKey).push({ ...fallbackQuestion });
          showError("quiz", "مشکلی در تولید سؤال پیش آمد. از سؤال پیش‌فرض استفاده شد.");
          showLoading(false);
          return fallbackQuestion;
        }
        await new Promise(resolve => setTimeout(resolve, baseDelay * Math.pow(2, attempt - 1)));
      }
    }
    showLoading(false);
    return null;
  }

  async function generateLesson(grade, chapterId, userAnswers, retries = 10, baseDelay = 1000) {
    showLoading(true);
    const incorrectTopics = userAnswers.filter(a => !a.isCorrect).map(a => a.topic).join(", ") || "هیچ اشتباه";
    const prompt = `
      Generate a detailed lesson in Persian for grade ${grade}, chapter "${chapters[grade].find(c => c.id == chapterId).name}", focusing on incorrect topics: ${incorrectTopics}.
      For each incorrect answer in userAnswers: ${JSON.stringify(userAnswers.filter(a => !a.isCorrect).map(a => ({ question: a.question, selected: a.selected, correct: a.correct, topic: a.topic })))},
      provide a step-by-step solution in Persian.
      Return clean HTML with:
      - <h3> for topic titles
      - <p> for explanations
      - <ul><li> for steps or examples
      Use LaTeX with \\( and \\) for inline math, \\[ and \\] for display math.
      Include a step-by-step solution for \\(\\frac{3a^4b^{-2}(2a^2b^3)^2}{6a^3b^5}\\) in a separate section.
      Example format:
      <h3>موضوع: [نام موضوع]</h3>
      <p>[توضیح کلی]</p>
      <h3>بررسی پاسخ‌های نادرست</h3>
      <div>
        <p><strong>سؤال:</strong> [سؤال]</p>
        <p><strong>پاسخ شما:</strong> [پاسخ اشتباه]</p>
        <p><strong>پاسخ صحیح:</strong> [پاسخ صحیح]</p>
        <p><strong>توضیح:</strong> [توضیح]</p>
        <ul>
          <li>[گام اول]</li>
          <li>[گام دوم]</li>
        </ul>
      </div>
      <h3>مثال اضافی</h3>
      <p>حل عبارت \\(\\frac{3a^4b^{-2}(2a^2b^3)^2}{6a^3b^5}\\):</p>
      <ul>
        <li>[گام اول]</li>
        <li>[گام دوم]</li>
      </ul>
    `;

    for (let attempt = 1; attempt <= retries; attempt++) {
      try {
        const response = await openai.chat.completions.create({
          model: 'gpt-4o',
          messages: [
            { role: 'system', content: 'You are a math lesson generator that provides structured HTML responses in Persian.' },
            { role: 'user', content: prompt }
          ]
        });
        const lessonContent = sanitizeLatex(response.choices[0].message.content.replace(/```html\n|\n```/g, ''));
        if (!lessonContent.trim()) {
          throw new Error("محتوای درسنامه خالی است");
        }
        const lessonContentDiv = document.getElementById("lesson-content");
        if (lessonContentDiv) {
          lessonContentDiv.innerHTML = lessonContent;
        }
        setTimeout(() => MathJax.typesetPromise().catch(err => console.error("MathJax error:", err)), 100);
        showLoading(false);
        return lessonContent;
      } catch (error) {
        console.error(`تلاش ${attempt} برای تولید درسنامه ناموفق بود:`, error.message);
        if (attempt === retries) {
          const incorrectAnswers = userAnswers.filter(a => !a.isCorrect);
          let lessonContent = `
            <h3>درسنامه برای پایه ${grade}، فصل ${chapters[grade].find(c => c.id == chapterId).name}</h3>
            <p>موضوعات مورد نیاز برای مطالعه: ${incorrectTopics}</p>`;
          if (incorrectAnswers.length > 0) {
            lessonContent += `<h3>بررسی پاسخ‌های نادرست</h3>`;
            incorrectAnswers.forEach((ans, idx) => {
              lessonContent += `
                <div class="mb-4">
                  <p><strong>سؤال ${idx + 1}:</strong> ${sanitizeLatex(ans.question)}</p>
                  <p><strong>پاسخ شما:</strong> ${ans.selected || "بدون پاسخ"}</p>
                  <p><strong>پاسخ صحیح:</strong> ${ans.correct}</p>
                  <p><strong>توضیح:</strong> برای حل این سؤال، باید مراحل زیر را دنبال کنید:</p>
                  <ul>
                    <li>گام اول: سؤال را به دقت بخوانید و متغیرها را شناسایی کنید.</li>
                    <li>گام دوم: از قوانین جبری مناسب (مانند جمع، تفریق، یا حل معادله) استفاده کنید.</li>
                    <li>گام سوم: پاسخ را با گزینه‌های موجود مقایسه کنید.</li>
                  </ul>
                </div>`;
            });
          } else {
            lessonContent += `<p>شما همه سؤالات را درست پاسخ دادید! برای تمرین بیشتر، روی موضوعات زیر تمرکز کنید: ${topics[grade][chapterId].join(", ")}</p>`;
          }
          lessonContent += `
            <h3>مثال: ساده‌سازی عبارت \\(\\frac{3a^4b^{-2}(2a^2b^3)^2}{6a^3b^5}\\)</h3>
            <p>حل گام‌به‌گام:</p>
            <ul>
              <li>ابتدا عبارت داخل پرانتز را ساده کنیم: \\((2a^2b^3)^2 = 2^2 (a^2)^2 (b^3)^2 = 4a^4b^6\\)</li>
              <li>حال عبارت به صورت \\(\\frac{3a^4b^{-2} \cdot 4a^4b^6}{6a^3b^5}\\) است.</li>
              <li>ضرایب را ساده کنیم: \\(\\frac{3 \cdot 4}{6} = \frac{12}{6} = 2\\)</li>
              <li>برای متغیر \\(a\\): \\(a^4 \cdot a^4 / a^3 = a^{4+4-3} = a^5\\)</li>
              <li>برای متغیر \\(b\\): \\(b^{-2} \cdot b^6 / b^5 = b^{-2+6-5} = b^{-1} = \frac{1}{b}\\)</li>
              <li>نتیجه نهایی: \\(2a^5 \cdot \frac{1}{b} = \frac{2a^5}{b}\\)</li>
            </ul>
            <p><strong>پاسخ نهایی: \\(\\frac{2a^5}{b}\\)</strong></p>`;
          const lessonContentDiv = document.getElementById("lesson-content");
          if (lessonContentDiv) {
            lessonContentDiv.innerHTML = sanitizeLatex(lessonContent);
          }
          setTimeout(() => MathJax.typesetPromise().catch(err => console.error("MathJax error:", err)), 100);
          showError("lesson", "مشکلی در تولید درسنامه پیش آمد. درسنامه پیش‌فرض نمایش داده شد.");
          showLoading(false);
          return lessonContent;
        }
        await new Promise(resolve => setTimeout(resolve, baseDelay * Math.pow(2, attempt - 1)));
      }
    }
    showLoading(false);
    return null;
  }

  async function getCoachResponse(question, retries = 10, baseDelay = 1000) {
    showLoading(true);

      `
      : `
        You are a math coach for grades 7-9. Answer this question in Persian: "${question}".
        Return an educational HTML response with:
        - <h3> for titles
        - <p> for explanations
        - <ul><li> for steps or examples
        For math problems, provide step-by-step solutions. For concepts, explain clearly with examples.

        <h3>پاسخ به سؤال</h3>

        <ul>
          <li>[گام اول]</li>
          <li>[گام دوم]</li>
        </ul>
        <p><strong>پاسخ نهایی:</strong> [پاسخ]</p>
      `;

    for (let attempt = 1; attempt <= retries; attempt++) {
      try {
        const response = await openai.chat.completions.create({
          model: 'gpt-4o',
          messages: [
            { role: 'system', content: isGreeting ? 'You are a friendly math coach providing welcoming responses in Persian.' : 'You are a math coach providing educational responses in Persian.' },

        showLoading(false);
        return responseText;

          const errorMessage = error.message.includes("429") ? "سرویس موقتاً شلوغ است. لطفاً کمی بعد تلاش کنید." : "لطفاً دوباره تلاش کنید.";
          showError("chat", errorMessage);

            ? `
              <h3>خوش‌آمدگویی</h3>
              <p>سلام! خیلی خوشحال می‌شم که بتونم بهت کمک کنم. اگه سؤالی درباره ریاضی داری، بپرس تا باهم حلش کنیم!</p>`
            : `
              <h3>پاسخ به سؤال</h3>
              <p>سؤال شما: "${question.replace(/</g, "&lt;").replace(/>/g, "&gt;")}"</p>
              <p>متأسفانه در حال حاضر نمی‌توانیم پاسخ دهیم. لطفاً سؤال خود را واضح‌تر بیان کنید یا بعداً تلاش کنید.</p>`;

          if (chatHistoryDiv) {

              <div class="mb-4 p-3 bg-blue-50 rounded-lg">

          return fallbackResponse;
        }
        await new Promise(resolve => setTimeout(resolve, baseDelay * Math.pow(2, attempt - 1)));
      }
    }
    showLoading(false);

      alert("ایمیل تأیید مجدداً ارسال شد!");
    } catch (error) {
      console.error("خطا در ارسال مجدد ایمیل تأیید:", error.message);
      showError("verify", "مشکلی در ارسال ایمیل تأیید پیش آمد. لطفاً دوباره تلاش کنید.");
    } finally {
      showLoading(false);
    }
  });

  document.getElementById("check-verification-btn")?.addEventListener("click", async () => {
    showLoading(true);
    if (!auth.currentUser) {
      showError("verify", "لطفاً ابتدا وارد شوید.");
      showSection("auth-section");
      showLoading(false);
      return;
    }
    try {
      await auth.currentUser.reload();
      if (auth.currentUser.emailVerified) {
        showSection("grade-section");
      } else {
        showError("verify", "ایمیل شما هنوز تأیید نشده است!");
      }
    } catch (error) {
      console.error("خطا در بررسی تأیید ایمیل:", error.message);
      showError("verify", "مشکلی در بررسی وضعیت تأیید پیش آمد. لطفاً دوباره تلاش کنید.");
    } finally {
      showLoading(false);
    }
  });

  document.getElementById("grade-select")?.addEventListener("change", () => {
    const grade = document.getElementById("grade-select")?.value;
    const chapterSelect = document.getElementById("chapter-select");
    if (chapterSelect) {
      chapterSelect.innerHTML = "";
      chapters[grade].forEach(chapter => {
        const option = document.createElement("option");
        option.value = chapter.id;
        option.textContent = chapter.name;
        chapterSelect.appendChild(option);
      });
    }
  });

  let currentQuestions = [];
  let currentQuestionIndex = 0;
  let userAnswers = [];
  let timerInterval;
  document.getElementById("start-quiz-btn")?.addEventListener("click", async () => {
    showLoading(true);
    questionCache.clear();
    const grade = document.getElementById("grade-select")?.value;
    const chapterId = document.getElementById("chapter-select")?.value;
    const questionCount = document.getElementById("question-count")?.value || 3; // انتخاب تعداد سؤالات
    currentQuestions = [];
    try {
      const questionPromises = Array.from({ length: questionCount }, (_, i) => {
        const difficulty = (i % 3) + 1;
        return generateQuestion(grade, chapterId, difficulty);
      });
      const questions = await Promise.all(questionPromises);
      currentQuestions = questions.filter(q => q !== null);
      if (currentQuestions.length === 0) {
        showError("quiz", "لطفاً دوباره تلاش کنید.");
        showLoading(false);
        return;
      }
      currentQuestionIndex = 0;
      userAnswers = [];
      showQuestion();
      showSection("quiz-section");
    } catch (error) {
      console.error("خطا در شروع آزمون:", error.message);
      showError("quiz", "مشکلی در شروع آزمون پیش آمد. لطفاً دوباره تلاش کنید.");
    } finally {
      showLoading(false);
    }
  });

  function showQuestion() {
    const question = currentQuestions[currentQuestionIndex];
    const questionTitle = document.getElementById("question-title");
    if (questionTitle) {
      questionTitle.innerHTML = sanitizeLatex(question.text);
    }
    const optionsDiv = document.getElementById("options");
    if (optionsDiv) {
      optionsDiv.innerHTML = "";
      question.options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = String(option);
        button.classList.add("w-full", "p-2", "border", "rounded", "hover:bg-gray-200", "transition", "btn");
        button.addEventListener("click", () => {
          document.querySelectorAll("#options button").forEach(btn => btn.classList.remove("bg-blue-200"));
          button.classList.add("bg-blue-200");
        });
        optionsDiv.appendChild(button);
      });
    }
    setTimeout(() => MathJax.typesetPromise().catch(err => console.error("MathJax error:", err)), 100);

    const timeLimit = question.difficulty === 1 ? 20 : question.difficulty === 2 ? 30 : 45;
    let timeLeft = timeLimit;
    const timerElement = document.getElementById("timer");
    if (timerElement) {
      timerElement.textContent = `زمان باقی‌مانده: ${timeLeft} ثانیه`;
    }
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      if (timerElement) {
        timerElement.textContent = `زمان باقی‌مانده: ${timeLeft} ثانیه`;
      }
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitAnswer(null);
      }
    }, 1000);
  }

  document.getElementById("submit-answer-btn")?.addEventListener("click", () => {
    const selectedButton = document.querySelector("#options button.bg-blue-200");
    const selectedAnswer = selectedButton ? selectedButton.textContent : null;
    submitAnswer(selectedAnswer);
  });

  function submitAnswer(selectedAnswer) {
    clearInterval(timerInterval);
    const question = currentQuestions[currentQuestionIndex];
    const isCorrect = selectedAnswer === question.correctAnswer;
    userAnswers.push({
      question: question.text,
      selected: selectedAnswer,
      correct: question.correctAnswer,
      isCorrect,
      topic: question.topic
    });

    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
      showQuestion();
    } else {
      endQuiz();
    }
  }

  document.getElementById("end-quiz-btn")?.addEventListener("click", endQuiz);

  async function endQuiz() {
    showLoading(true);
    clearInterval(timerInterval);
    const grade = document.getElementById("grade-select")?.value;
    const chapterId = document.getElementById("chapter-select")?.value;
    const correctCount = userAnswers.filter(a => a.isCorrect).length;
    const completionPercentage = userAnswers.length > 0 ? (correctCount / userAnswers.length) * 100 : 0;

    try {
      if (!currentUser) throw new Error("کاربر وارد نشده است.");
      const userDocRef = doc(db, "users", currentUser);
      const userDoc = await getDoc(userDocRef);
      let progress = userDoc.exists() ? userDoc.data().progress || {} : {};
      if (!progress[grade]) progress[grade] = {};

      const progressData = {
        completion: completionPercentage,
        answers: userAnswers,
        timestamp: new Date().toISOString()
      };
      progress[grade][chapterId] = progressData;

      await setDoc(userDocRef, { progress }, { merge: true });
      await generateLesson(grade, chapterId, userAnswers);
      showSection("lesson-section");
    } catch (error) {
      console.error("خطا در پایان آزمون:", error.message);
      showError("lesson", "مشکلی در ذخیره پیشرفت یا تولید درسنامه پیش آمد.");
    } finally {
      showLoading(false);
    }
  }

  let progressChart = null;
  async function showProgress() {
    showLoading(true);
    const grade = document.getElementById("grade-select")?.value;
    try {
      if (!currentUser) throw new Error("کاربر وارد نشده است.");
      const userDoc = await getDoc(doc(db, "users", currentUser));
      const progressData = userDoc.exists() && userDoc.data().progress?.[grade] ? userDoc.data().progress[grade] : {};
      const labels = chapters[grade].map(ch => ch.name);
      const data = chapters[grade].map(ch => progressData[ch.id]?.completion || 0);

      if (!labels.length || !data.every(d => typeof d === 'number')) {
        throw new Error("داده‌های نمودار نامعتبر هستند");
      }

      const ctx = document.getElementById("progress-chart")?.getContext("2d");
      if (!ctx) throw new Error("عنصر نمودار یافت نشد");
      if (progressChart) progressChart.destroy();
      progressChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "درصد تکمیل",
            data,
            backgroundColor: "rgba(54, 162, 235, 0.5)",
            borderColor: "rgba(54, 162, 235, 1)",
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100, title: { display: true, text: 'درصد' } },
            x: { title: { display: true, text: 'فصل‌ها' } }
          },
          plugins: {
            legend: { display: true, position: 'top' }
          }
        }
      });
      showSection("progress-section");
    } catch (error) {
      console.error("خطا در نمایش پیشرفت:", error.message);
      showError("progress", "مشکلی در نمایش پیشرفت پیش آمد. لطفاً دوباره تلاش کنید.");
    } finally {
      showLoading(false);
    }
  }

  document.getElementById("send-chat-btn")?.addEventListener("click", async () => {
    showLoading(true);
    const chatInput = document.getElementById("chat-input");
    const question = chatInput?.value.trim();
    if (!question) {
      showError("chat", "لطفاً یک سؤال وارد کنید!");
      showLoading(false);
      return;
    }
    try {
      if (!currentUser) throw new Error("کاربر وارد نشده است.");
      const response = await getCoachResponse(question);
      if (!response) throw new Error("پاسخ مربی دریافت نشد");
      const chatEntry = {
        question,
        response,
        timestamp: new Date().toISOString()
      };
      await addDoc(collection(db, "users", currentUser, "chatHistory"), chatEntry);
      await updateChatHistory();
      chatInput.value = "";
    } catch (error) {
      console.error("خطا در ذخیره چت:", error.message);
      let errorMessage = "مشکلی در ارسال یا ذخیره پیام پیش آمد.";
      if (error.code === "permission-denied") {
        errorMessage = "دسترسی به این عملیات ممکن نیست.";
      } else if (error.code === "unavailable") {
        errorMessage = "سرویس موقتاً در دسترس نیست.";
      }
      showError("chat", errorMessage);
    } finally {
      showLoading(false);
    }
  });

  async function updateChatHistory() {
    showLoading(true);
    const chatHistoryDiv = document.getElementById("chat-history");
    if (!chatHistoryDiv) return;
    chatHistoryDiv.innerHTML = "";
    try {
      if (!currentUser) {
        throw new Error("کاربر وارد نشده است.");
      }
      const q = query(collection(db, "users", currentUser, "chatHistory"), orderBy("timestamp", "asc"));
      const snapshot = await getDocs(q);
      if (snapshot.empty) {
        chatHistoryDiv.innerHTML = "<p class='text-gray-500 text-center'>هنوز گفتگویی ثبت نشده است.</p>";
      } else {
        const chats = [];
        snapshot.forEach(doc => chats.push(doc.data()));
        chats.reverse().forEach(chat => {
          const question = chat.question ? chat.question.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "سؤال نامشخص";
          const response = chat.response ? chat.response : "<p>پاسخ دریافت نشد.</p>";
          chatHistoryDiv.innerHTML += `
            <div class="mb-4 p-3 bg-blue-50 rounded-lg shadow-sm">
              <p><strong class="text-blue-600">شما:</strong> ${question}</p>
              <p><strong class="text-green-600">مربی:</strong> ${response}</p>
              <p class="text-gray-400 text-sm">${new Date(chat.timestamp).toLocaleString('fa-IR')}</p>
            </div>`;
        });
        chatHistoryDiv.scrollTop = 0;
        setTimeout(() => MathJax.typesetPromise().catch(err => console.error("MathJax error:", err)), 100);
      }
    } catch (error) {
      console.error("خطا در بارگذاری تاریخچه چت:", error.message);
      let errorMessage = "مشکلی در بارگذاری تاریخچه چت پیش آمد.";
      if (error.code === "permission-denied") {
        errorMessage = "دسترسی به تاریخچه چت ممکن نیست.";
      } else if (error.code === "unavailable") {
        errorMessage = "سرویس موقتاً در دسترس نیست.";
      }
      showError("chat", errorMessage);
      chatHistoryDiv.innerHTML = "<p class='text-red-500 text-center'>مشکلی در بارگذاری تاریخچه چت پیش آمد.</p>";
    } finally {
      showLoading(false);
    }
  }

  let adminProgressChart = null;
  async function loadAdminPanel() {
    showLoading(true);
    try {
      if (!isAdmin) {
        showError("admin", "دسترسی غیرمجاز!");
        showSection("auth-section");
        showLoading(false);
        return;
      }
      const userListDiv = document.getElementById("user-list");
      if (!userListDiv) return;
      userListDiv.innerHTML = "";
      const usersSnapshot = await getDocs(collection(db, "users"));
      if (usersSnapshot.empty) {
        userListDiv.innerHTML = "<p class='text-gray-500'>هیچ کاربری یافت نشد.</p>";
        showLoading(false);
        return;
      }
      userListDiv.innerHTML = "<ul class='space-y-2'>";
      usersSnapshot.forEach(doc => {
        const user = doc.data();
        if (!user.email || !user.firstName || !user.lastName) return;
        userListDiv.innerHTML += `
          <li class="p-3 bg-blue-50 rounded-lg">
            <p><strong>نام:</strong> ${user.firstName} ${user.lastName}</p>
            <p><strong>ایمیل:</strong> ${user.email}</p>
            <p><strong>پایه:</strong> ${user.grade}</p>
          </li>`;
      });
      userListDiv.innerHTML += "</ul>";
    } catch (error) {
      console.error("خطا در بارگذاری پنل ادمین:", error.message);
      showError("admin", "مشکلی در بارگذاری پنل ادمین پیش آمد.");
    } finally {
      showLoading(false);
    }
  }

  async function showAdminProgress(userData, grade) {
    try {
      const progressData = userData.progress?.[grade] || {};
      const labels = chapters[grade].map(ch => ch.name);
      const data = chapters[grade].map(ch => progressData[ch.id]?.completion || 0);

      if (!labels.length || !data.every(d => typeof d === 'number')) {
        throw new Error("داده‌های نمودار نامعتبر هستند");
      }

      const ctx = document.getElementById("admin-progress-chart")?.getContext("2d");
      if (!ctx) throw new Error("عنصر نمودار یافت نشد");
      if (adminProgressChart) adminProgressChart.destroy();
      adminProgressChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: `درصد تکمیل پایه ${grade}`,
            data,
            backgroundColor: "rgba(54, 162, 235, 0.5)",
            borderColor: "rgba(54, 162, 235, 1)",
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100, title: { display: true, text: 'درصد' } },
            x: { title: { display: true, text: 'فصل‌ها' } }
          },
          plugins: {
            legend: { display: true, position: 'top' }
          }
        }
      });
      const chartElement = document.getElementById("admin-progress-chart");
      if (chartElement) {
        chartElement.classList.remove("hidden");
      }
    } catch (error) {
      console.error("خطا در نمایش پیشرفت ادمین:", error.message);
      showError("admin", "مشکلی در نمایش پیشرفت پیش آمد.");
      const chartElement = document.getElementById("admin-progress-chart");
      if (chartElement) {
        chartElement.classList.add("hidden");
      }
    }
  }

  document.getElementById("admin-search-btn")?.addEventListener("click", async () => {
    showLoading(true);
    const searchEmail = document.getElementById("admin-search-user")?.value.trim();
    if (!searchEmail) {
      showError("admin", "لطفاً ایمیل کاربر را وارد کنید!");
      showLoading(false);
      return;
    }
    try {
      if (!isAdmin) {
        showError("admin", "دسترسی غیرمجاز!");
        showSection("auth-section");
        showLoading(false);
        return;
      }
      const usersSnapshot = await getDocs(collection(db, "users"));
      let found = false;
      let userId = null;
      const userDetailsDiv = document.getElementById("admin-user-details");
      if (!userDetailsDiv) return;
      userDetailsDiv.innerHTML = "";
      for (const doc of usersSnapshot.docs) {
        const user = doc.data();
        if (user.email === searchEmail) {
          found = true;
          userId = doc.id;
          if (!user.firstName || !user.lastName || !user.grade) {
            userDetailsDiv.innerHTML = "<p class='text-red-500'>داده‌های کاربر ناقص است.</p>";
            showLoading(false);
            return;
          }
          userDetailsDiv.innerHTML = `
            <div class="p-4 bg-blue-50 rounded-lg">
              <p><strong>نام:</strong> ${user.firstName} ${user.lastName}</p>
              <p><strong>ایمیل:</strong> ${user.email}</p>
              <p><strong>پایه:</strong> ${user.grade}</p>
              <h4 class="font-semibold mt-4">پیشرفت:</h4>
              <select id="admin-grade-select" class="w-full input mb-4">
                <option value="7">پایه هفتم</option>
                <option value="8">پایه هشتم</option>
                <option value="9">پایه نهم</option>
              </select>
              <canvas id="admin-progress-chart"></canvas>
              <h4 class="font-semibold mt-4">تاریخچه آزمون‌ها:</h4>
              <div id="admin-quiz-history" class="bg-gray-100 p-2 rounded"></div>
            </div>`;
          const gradeSelect = document.getElementById("admin-grade-select");
          if (gradeSelect) {
            gradeSelect.classList.remove("hidden");
            gradeSelect.addEventListener("change", () => {
              const selectedGrade = gradeSelect.value;
              showAdminProgress(user, selectedGrade);
            });
          }
          await showAdminProgress(user, "7");

          const quizHistoryDiv = userDetailsDiv.querySelector("#admin-quiz-history");
          const progress = user.progress || {};
          let hasQuizzes = false;
          for (const grade in progress) {
            for (const chapterId in progress[grade]) {
              hasQuizzes = true;
              const quiz = progress[grade][chapterId];
              quizHistoryDiv.innerHTML += `
                <div class="mb-4 p-3 bg-white rounded">
                  <p><strong>پایه:</strong> ${grade}</p>
                  <p><strong>فصل:</strong> ${chapters[grade].find(c => c.id == chapterId).name}</p>
                  <p><strong>زمان:</strong> ${new Date(quiz.timestamp).toLocaleString('fa-IR')}</p>
                  <p><strong>درصد تکمیل:</strong> ${quiz.completion.toFixed(2)}%</p>
                  <div class="mt-2">
                    <p class="font-semibold">سؤالات و پاسخ‌ها:</p>
                    <ul class="list-disc pl-5">
                      ${quiz.answers.map((ans, idx) => `
                        <li class="mt-1">
                          <p><strong>سؤال ${idx + 1}:</strong> ${sanitizeLatex(ans.question)}</p>
                          <p><strong>پاسخ شما:</strong> ${ans.selected || "بدون پاسخ"}</p>
                          <p><strong>پاسخ صحیح:</strong> ${ans.correct}</p>
                          <p><strong>وضعیت:</strong> ${ans.isCorrect ? "صحیح" : "غلط"}</p>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                </div>`;
            }
          }
          if (!hasQuizzes) {
            quizHistoryDiv.innerHTML = "<p class='text-gray-500'>هیچ آزمونی ثبت نشده است.</p>";
          }
          setTimeout(() => MathJax.typesetPromise().catch(err => console.error("MathJax error:", err)), 100);
          break;
        }
      }
      if (!found) {
        userDetailsDiv.innerHTML = "<p class='text-red-500'>کاربری با این ایمیل یافت نشد.</p>";
      }
    } catch (error) {
      console.error("خطا در جستجوی کاربر:", error.message);
      showError("admin", "مشکلی در جستجوی کاربر پیش آمد. لطفاً دوباره تلاش کنید.");
    } finally {
      showLoading(false);
    }
  });

  document.getElementById("admin-logout-btn")?.addEventListener("click", async () => {
    showLoading(true);
    try {
      await signOut(auth);
      showSection("auth-section");
    } catch (error) {
      console.error("خطا در خروج ادمین:", error.message);
      showError("admin", "مشکلی در خروج پیش آمد.");
    } finally {
      showLoading(false);
    }
  });

  document.getElementById("back-to-auth-btn")?.addEventListener("click", () => showSection("auth-section"));
  document.getElementById("back-to-auth-from-grade-btn")?.addEventListener("click", () => showSection("auth-section"));
  document.getElementById("back-to-grade-btn")?.addEventListener("click", () => showSection("grade-section"));
  document.getElementById("back-to-grade-from-progress-btn")?.addEventListener("click", () => showSection("grade-section"));
  document.getElementById("back-to-grade-from-chat-btn")?.addEventListener("click", () => showSection("grade-section"));
  document.getElementById("back-to-grade-from-quiz")?.addEventListener("click", () => showSection("grade-section"));
  document.getElementById("back-to-auth-from-admin-btn")?.addEventListener("click", () => showSection("auth-section"));
  document.getElementById("view-progress-btn")?.addEventListener("click", showProgress);
  document.getElementById("view-chat-btn")?.addEventListener("click", async () => {
    await updateChatHistory();
    showSection("chat-section");
  });

  document.getElementById("grade-select")?.dispatchEvent(new Event("change"));
} catch (error) {
  console.error("خطا در راه‌اندازی Firebase:", error.message);
  showError("auth", "مشکلی در راه‌اندازی برنامه پیش آمد.");
}
  </script>
</body>
</html>
