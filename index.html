<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ضرب چندجمله‌ای‌ها</title>
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
      direction: rtl;
    }
    .neu {
      background: #e0e0e0;
      border-radius: 20px;
      box-shadow: 10px 10px 30px #bebebe, -10px -10px 30px #ffffff;
      padding: 20px;
      margin: 20px;
      width: 90%;
      max-width: 700px;
    }
    input, button {
      font-size: 1rem;
      border: none;
      padding: 10px;
      border-radius: 10px;
      margin: 5px 0;
      width: 100%;
      background: #e0e0e0;
      box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff;
    }
    button {
      cursor: pointer;
      background: #e0e0e0;
      box-shadow: 4px 4px 8px #bebebe, -4px -4px 8px #ffffff;
      transition: 0.2s ease;
    }
    button:hover {
      box-shadow: inset 2px 2px 6px #bebebe, inset -2px -2px 6px #ffffff;
    }
    #result span {
      font-weight: bold;
    }
    .x { color: #0077cc; }
    .y { color: #228b22; }
    .z { color: #ff8800; }
    .other { color: #9933cc; }
    canvas {
      margin-top: 20px;
      background: #f0f0f0;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="neu">
    <h2>ضرب چندجمله‌ای‌ها</h2>
    <input type="number" id="count" placeholder="تعداد عبارات" min="2" />
    <button onclick="generateInputs()">ایجاد ورودی‌ها</button>
    <div id="inputs"></div>
    <button onclick="calculate()">محاسبه ضرب و ساده‌سازی</button>
    <div id="result" class="neu"></div>
    <canvas id="graph" width="600" height="300"></canvas>
    <div id="history" class="neu"></div>
  </div>
  <div>
    <a href="./inde2.html">رفتن به ماشین حساب علمی</a>
  </div>
  <script>
    function generateInputs() {
      const count = parseInt(document.getElementById('count').value);
      const container = document.getElementById('inputs');
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const input = document.createElement('input');
        input.className = 'poly-input';
        input.placeholder = `عبارت ${i + 1} (مثلاً 3x+5x^2+6)`;
        container.appendChild(input);
      }
    }

    function parsePoly(str) {
      const terms = str.replace(/\s+/g, '').match(/[+-]?[^+-]+/g);
      const poly = {};
      terms?.forEach(term => {
        let match = term.match(/^([+-]?\d*)([a-zA-Z]?)(\^(\d+))?$/);
        if (match) {
          let [, coeff, variable, , power] = match;
          coeff = coeff === '' || coeff === '+' ? 1 : coeff === '-' ? -1 : parseFloat(coeff);
          const key = variable ? variable + (power ? '^' + power : '') : '1';
          poly[key] = (poly[key] || 0) + coeff;
        }
      });
      return poly;
    }

    function multiplyPolys(p1, p2) {
      const result = {};
      for (let key1 in p1) {
        for (let key2 in p2) {
          const coeff = p1[key1] * p2[key2];
          const vars1 = key1 === '1' ? [] : key1.split('*');
          const vars2 = key2 === '1' ? [] : key2.split('*');
          const combinedVars = [...vars1, ...vars2];
          const varMap = {};
          for (let v of combinedVars) {
            let [name, pow] = v.split('^');
            pow = parseInt(pow || 1);
            varMap[name] = (varMap[name] || 0) + pow;
          }
          const sortedVars = Object.entries(varMap)
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([name, pow]) => pow === 1 ? name : `${name}^${pow}`)
            .join('*');
          const key = sortedVars || '1';
          result[key] = (result[key] || 0) + coeff;
        }
      }
      return result;
    }

    function formatPoly(poly) {
      return Object.entries(poly)
        .filter(([_, coeff]) => coeff !== 0)
        .sort((a, b) => totalDegree(b[0]) - totalDegree(a[0]))
        .map(([term, coeff]) => {
          const colorClass = getColorClass(term);
          if (term === '1') return `<span>${coeff}</span>`;
          return `<span class="${colorClass}">${coeff}${term.replace(/\*/g, '')}</span>`;
        })
        .join(' + ')
        .replace(/\+\s-\s/g, '- ');
    }

    function totalDegree(term) {
      if (term === '1') return 0;
      return term.split('*').reduce((sum, t) => {
        const [, pow] = t.split('^');
        return sum + (parseInt(pow || 1));
      }, 0);
    }

    function getColorClass(term) {
      if (term.includes('x')) return 'x';
      if (term.includes('y')) return 'y';
      if (term.includes('z')) return 'z';
      return 'other';
    }

    function calculate() {
      const inputs = document.querySelectorAll('.poly-input');
      let result = parsePoly(inputs[0].value);
      for (let i = 1; i < inputs.length; i++) {
        const poly = parsePoly(inputs[i].value);
        result = multiplyPolys(result, poly);
      }
      const resultHTML = formatPoly(result);
      document.getElementById('result').innerHTML = resultHTML;
      saveToHistory(inputs, resultHTML);
      drawGraph(result);
      showHistory();
    }

    function saveToHistory(inputs, resultHTML) {
      const expressions = Array.from(inputs).map(i => i.value).join(' × ');
      const history = JSON.parse(localStorage.getItem('polyHistory') || '[]');
      history.unshift({ expr: expressions, result: resultHTML });
      localStorage.setItem('polyHistory', JSON.stringify(history.slice(0, 10))); // max 10
    }

    function showHistory() {
      const historyDiv = document.getElementById('history');
      const history = JSON.parse(localStorage.getItem('polyHistory') || '[]');
      historyDiv.innerHTML = `<h3>📚 تاریخچه:</h3>` + history.map(h =>
        `<div style="margin-bottom: 10px;">
          <div>➤ ${h.expr}</div>
          <div>= ${h.result}</div>
        </div>`
      ).join('');
    }

    function drawGraph(poly) {
      const canvas = document.getElementById('graph');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const scale = 20;

      ctx.beginPath();
      ctx.moveTo(0, centerY);
      ctx.lineTo(width, centerY);
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, height);
      ctx.strokeStyle = "#aaa";
      ctx.stroke();

      ctx.beginPath();
      for (let px = 0; px < width; px++) {
        let x = (px - centerX) / scale;
        let y = evaluatePoly(poly, x);
        let py = centerY - y * scale;
        if (px === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = "#ff3366";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function evaluatePoly(poly, x) {
      let total = 0;
      for (let key in poly) {
        if (key.includes('*') || key.includes('y') || key.includes('z')) continue;
        const match = key.match(/x(?:\^(\d+))?/);
        const power = match ? parseInt(match[1] || 1) : 0;
        total += poly[key] * Math.pow(x, power);
      }
      return total;
    }

    window.onload = showHistory;
  </script>

</body>
</html>
