    function hideLoading() {

    // Generate question with Gemini via proxy
    async function generateQuestion(grade, chapterId, difficulty) {
      showLoading();
      const topic = topics[grade][chapterId][Math.floor(Math.random() * topics[grade][chapterId].length)];
      const prompt = `Generate a math question for grade ${grade}, chapter "${chapters[grade].find(c => c.id == chapterId).name}", topic: "${topic}", difficulty level: ${difficulty} (1 for easy, 2 for medium, 3 for hard). Provide the question, correct answer, and 4 multiple-choice options in JSON format. Ensure options are strings or numbers, and the correct answer is one of the options. Example: {"question": "2 + 2 = ?", "correctAnswer": "4", "options": ["2", "4", "6", "8"]}`;
      try {
        const response = await fetch("http://localhost:3000/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text.replace(/```json\n|\n```/g, '');
        const result = JSON.parse(rawText);
        if (!result.question || !result.correctAnswer || !Array.isArray(result.options) || result.options.length !== 4 || !result.options.includes(result.correctAnswer)) {
          throw new Error("Invalid question format");
        }
        hideLoading();
        return {
          text: result.question,
          correctAnswer: result.correctAnswer,
          options: result.options.map(String),
          topic,
          difficulty
        };
      } catch (error) {
        hideLoading();
        console.error("Error generating question:", error.message);
        alert("خطا در تولید سؤال. لطفاً دوباره تلاش کنید.");
        return null;
      }
    }

    // Generate lesson with Gemini via proxy
    async function generateLesson(grade, chapterId, userAnswers) {
      showLoading();
      const incorrectTopics = userAnswers.filter(a => !a.isCorrect).map(a => a.topic).join(", ") || "هیچ اشتباه";
      const prompt = `Generate a detailed lesson in Persian for grade ${grade}, chapter "${chapters[grade].find(c => c.id == chapterId).name}", focusing on topics where the user answered incorrectly: ${incorrectTopics}. Include explanations for correct and incorrect answers: ${JSON.stringify(userAnswers)}. Format the response in HTML with clear sections and examples.`;
      try {
        const response = await fetch("http://localhost:3000/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        const data = await response.json();
        hideLoading();
        return data.candidates[0].content.parts[0].text.replace(/```html\n|\n```/g, '');
      } catch (error) {
        hideLoading();
        console.error("Error generating lesson:", error.message);
        return `<p>درسنامه برای پایه ${grade}، فصل ${chapters[grade].find(c => c.id == chapterId).name}: لطفاً روی موضوعات ${incorrectTopics} تمرکز کنید.</p>`;
      }
    }

        alert("رمز عبور باید حداقل 6 کاراکتر باشد!");
        hideLoading();
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        await sendEmailVerification(user);
        await setDoc(doc(db, "users", user.uid), {
          firstName,
          lastName,
          grade,
          email,
          points: 0,
          role: email === "k.sharafie@gmail.com" ? "admin" : "user",
          createdAt: new Date().toISOString()
        });
        alert("ثبت‌نام با موفقیت انجام شد! لطفاً ایمیل خود را تأیید کنید.");
        showSection("verify-email-section");
      } catch (error) {
        console.error("Registration error:", error.message);
        alert(`خطا در ثبت‌نام: ${error.message}`);
      } finally {
        hideLoading();
      }
    });

        hideLoading();
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {

        await signOut(auth);

        hideLoading();

    });

    document.getElementById("resend-verification-btn").addEventListener("click", async () => {

    document.getElementById("check-verification-btn").addEventListener("click", async () => {
      showLoading();
      if (!auth.currentUser) {
        alert("کاربر وارد نشده است. لطفاً دوباره وارد شوید.");

      } catch (error) {
        console.error("Check verification error:", error.message);

    // Populate chapters
    function populateChapters(gradeSelectId, chapterSelectId) {
      const grade = document.getElementById(gradeSelectId).value;
      const chapterSelect = document.getElementById(chapterSelectId);
      chapterSelect.innerHTML = "";
      chapters[grade].forEach(chapter => {
        const option = document.createElement("option");
        option.value = chapter.id;
        option.textContent = chapter.name;
        chapterSelect.appendChild(option);
      });
    }

    document.getElementById("grade-select").addEventListener("change", () => populateChapters("grade-select", "chapter-select"));
    document.getElementById("admin-grade-select").addEventListener("change", () => populateChapters("admin-grade-select", "admin-chapter-select"));

    // Quiz logic
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let timerInterval;
    let quizType = "standard";

    async function startQuiz(type) {
      if (isAdmin) {
        alert("ادمین نمی‌تواند آزمون شرکت کند!");
        return;
      }
      showLoading();
      quizType = type;
      const grade = document.getElementById("grade-select").value;
      const chapterId = document.getElementById("chapter-select").value;
      currentQuestions = [];
      if (type === "daily" || type === "challenge") {
        const collectionName = type === "daily" ? "dailyMissions" : "challenges";
        const q = query(collection(db, collectionName, grade, chapterId));
        const snapshot = await getDocs(q);
        snapshot.forEach(doc => {
          const data = doc.data();
          currentQuestions.push({
            text: data.question,
            correctAnswer: data.correctAnswer,
            options: data.options,
            topic: data.topic,
            difficulty: data.difficulty,
            points: data.points
          });
        });
      } else {
        for (let i = 1; i <= 10; i++) {
          const difficulty = (i % 3) + 1;
          const question = await generateQuestion(grade, chapterId, difficulty);
          if (question) currentQuestions.push({ ...question, points: difficulty * 10 });
        }
      }
      if (currentQuestions.length === 0) {
        alert("هیچ سؤالی موجود نیست!");
        hideLoading();
        return;
      }
      currentQuestionIndex = 0;
      userAnswers = [];
      showQuestion();
      showSection("quiz-section");
      hideLoading();
    }

    document.getElementById("start-quiz-btn").addEventListener("click", () => startQuiz("standard"));
    document.getElementById("start-daily-mission-btn").addEventListener("click", () => startQuiz("daily"));
    document.getElementById("start-challenge-btn").addEventListener("click", () => startQuiz("challenge"));

    function showQuestion() {
      const question = currentQuestions[currentQuestionIndex];
      document.getElementById("question-title").textContent = question.text;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      question.options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = String(option);
        button.classList.add("w-full", "p-2", "border", "rounded", "hover:bg-gray-200");
        button.addEventListener("click", () => {
          document.querySelectorAll("#options button").forEach(btn => btn.classList.remove("bg-blue-200"));
          button.classList.add("bg-blue-200");
        });
        optionsDiv.appendChild(button);
      });

      const timeLimits = { 1: 30, 2: 45, 3: 60 };
      let timeLeft = timeLimits[question.difficulty] || 30;
      document.getElementById("timer").textContent = `زمان باقی‌مانده: ${timeLeft} ثانیه`;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = `زمان باقی‌مانده: ${timeLeft} ثانیه`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitAnswer(null);
        }
      }, 1000);
    }

    document.getElementById("submit-answer-btn").addEventListener("click", () => {
      const selectedButton = document.querySelector("#options button.bg-blue-200");
      const selectedAnswer = selectedButton ? selectedButton.textContent : null;
      submitAnswer(selectedAnswer);
    });

    async function submitAnswer(selectedAnswer) {
      clearInterval(timerInterval);
      const question = currentQuestions[currentQuestionIndex];
      const isCorrect = selectedAnswer === question.correctAnswer;
      userAnswers.push({
        question: question.text,
        selected: selectedAnswer,
        correct: question.correctAnswer,
        isCorrect,
        topic: question.topic,
        points: isCorrect ? question.points : 0
      });

      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        await endQuiz();
      }
    }

    async function endQuiz() {
      if (isAdmin) return;
      clearInterval(timerInterval);
      const grade = document.getElementById("grade-select").value;
      const chapterId = document.getElementById("chapter-select").value;
      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      const totalPoints = userAnswers.reduce((sum, a) => sum + a.points, 0);

      try {
        if (!currentUser) throw new Error("کاربر وارد نشده است.");
        const userDocRef = doc(db, "users", currentUser);
        const userDoc = await getDoc(userDocRef);
        let progress = userDoc.exists() ? userDoc.data().progress || {} : {};
        let points = userDoc.exists() ? userDoc.data().points || 0 : 0;
        if (!progress[grade]) progress[grade] = {};
        progress[grade][chapterId] = {
          completion: (correctCount / userAnswers.length) * 100,
          answers: userAnswers,
          timestamp: new Date().toISOString()
        };
        points += totalPoints;
        await setDoc(userDocRef, { progress, points }, { merge: true });

        if (quizType !== "standard") {
          const collectionName = quizType === "daily" ? "dailyMissionResults" : "challengeResults";
          await addDoc(collection(db, collectionName, grade, chapterId), {
            userId: currentUser,
            answers: userAnswers,
            points: totalPoints,
            timestamp: new Date().toISOString()
          });
        }

        document.getElementById("lesson-content").innerHTML = await generateLesson(grade, chapterId, userAnswers);
        showSection("lesson-section");
      } catch (error) {
        console.error("Error saving progress:", error.message);
        alert(`خطا در ذخیره پیشرفت: ${error.message}`);
      }
    }

    document.getElementById("end-quiz-btn").addEventListener("click", endQuiz);

    // Progress chart
    let progressChart = null;
    async function showProgress() {
      if (isAdmin) {
        alert("ادمین نمی‌تواند پیشرفت را مشاهده کند!");
        return;
      }
      showLoading();
      const grade = document.getElementById("grade-select").value;
      try {
        if (!currentUser) throw new Error("کاربر وارد نشده است.");
        const userDoc = await getDoc(doc(db, "users", currentUser));
        const progressData = userDoc.exists() && userDoc.data().progress?.[grade] ? userDoc.data().progress[grade] : {};
        const labels = chapters[grade].map(ch => ch.name);
        const data = chapters[grade].map(ch => progressData[ch.id]?.completion || 0);

        if (labels.length === 0 || !data.every(d => typeof d === 'number')) {
          throw new Error("داده‌های نمودار نامعتبر است");
        }

        const ctx = document.getElementById("progress-chart").getContext("2d");
        if (progressChart) progressChart.destroy();
        progressChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "درصد تکمیل",
              data,
              backgroundColor: "rgba(54, 162, 235, 0.2)",
              borderColor: "rgba(54, 162, 235, 1)",
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true, max: 100, title: { display: true, text: "درصد تکمیل" } },
              x: { title: { display: true, text: "فصل‌ها" } }
            }
          }
        });
        showSection("progress-section");
      } catch (error) {
        console.error("Error showing progress:", error.message);
        document.getElementById("progress-chart").style.display = "none";
        document.querySelector("#progress-section").innerHTML += "<p class='text-red-500'>هیچ داده‌ای برای نمایش پیشرفت وجود ندارد.</p>";
      } finally {
        hideLoading();
      }
    }

    document.getElementById("view-progress-btn").addEventListener("click", showProgress);

    // Leaderboard
    async function showLeaderboard() {
      if (isAdmin) {
        alert("ادمین نمی‌تواند جدول رتبه‌بندی را مشاهده کند!");
        return;
      }
      showLoading();
      try {
        const leaderboardContent = document.getElementById("leaderboard-content");
        leaderboardContent.innerHTML = "";
        const usersSnapshot = await getDocs(collection(db, "users"));
        const users = [];
        usersSnapshot.forEach(doc => {
          const data = doc.data();
          if (data.role !== "admin") {
            users.push({ id: doc.id, ...data });
          }
        });

        for (const grade of ["7", "8", "9"]) {
          const gradeUsers = users.filter(u => u.grade === grade).sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 3);
          leaderboardContent.innerHTML += `<h3 class="text-lg font-bold mt-4">پایه ${grade}</h3>`;
          if (gradeUsers.length === 0) {
            leaderboardContent.innerHTML += "<p>هیچ کاربری در این پایه ثبت نشده است.</p>";
          } else {
            gradeUsers.forEach((user, index) => {
              leaderboardContent.innerHTML += `<p>${index + 1}. ${user.firstName} ${user.lastName} - امتیاز: ${user.points || 0}</p>`;
            });
          }
        }
        showSection("leaderboard-section");
      } catch (error) {
        console.error("Error showing leaderboard:", error.message);
        alert("خطا در نمایش جدول رتبه‌بندی");
      } finally {
        hideLoading();
      }
    }

    document.getElementById("view-leaderboard-btn").addEventListener("click", showLeaderboard);
    document.getElementById("back-to-grade-from-leaderboard-btn").addEventListener("click", () => showSection("grade-section"));

    // Group chat for top 9
    async function showGroupChat() {
      if (isAdmin) {
        alert("ادمین نمی‌تواند در چت گروهی شرکت کند!");
        return;
      }
      showLoading();
      try {
        const userDoc = await getDoc(doc(db, "users", currentUser));
        const user = userDoc.exists() ? userDoc.data() : {};
        const grade = user.grade;
        const usersSnapshot = await getDocs(collection(db, "users"));
        const users = [];
        usersSnapshot.forEach(doc => {
          const data = doc.data();
          if (data.role !== "admin") {
            users.push({ id: doc.id, ...data });
          }
        });
        const topUsers = users.filter(u => u.grade === grade).sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 3).map(u => u.id);
        if (!topUsers.includes(currentUser)) {
          alert("شما جزو سه نفر برتر پایه خود نیستید!");
          showSection("grade-section");
          return;
        }

        const groupChatHistory = document.getElementById("group-chat-history");
        groupChatHistory.innerHTML = "";
        const q = query(collection(db, "groupChats", grade), orderBy("timestamp"));
        const snapshot = await getDocs(q);
        snapshot.forEach(doc => {
          const chat = doc.data();
          const fileLink = chat.fileUrl ? `<a href="${chat.fileUrl}" target="_blank">دانلود فایل</a>` : "";
          groupChatHistory.innerHTML += `<div><strong>${chat.userName}:</strong> ${chat.message}${fileLink}<br><small>${chat.timestamp}</small><hr></div>`;
        });
        showSection("group-chat-section");
      } catch (error) {
        console.error("Error showing group chat:", error.message);
        alert("خطا در نمایش چت گروهی");
      } finally {
        hideLoading();
      }
    }

    document.getElementById("send-group-chat-btn").addEventListener("click", async () => {
      if (isAdmin) {
        alert("ادمین نمی‌تواند در چت گروهی شرکت کند!");
        return;
      }
      showLoading();
      const message = document.getElementById("group-chat-input").value.trim();
      const fileInput = document.getElementById("group-chat-file");
      const file = fileInput.files[0];
      const userDoc = await getDoc(doc(db, "users", currentUser));
      const user = userDoc.exists() ? userDoc.data() : {};
      const grade = user.grade;

      try {
        let fileUrl = "";
        if (file) {
          const storageRef = ref(storage, `groupChats/${grade}/${file.name}`);
          await uploadBytes(storageRef, file);
          fileUrl = await getDownloadURL(storageRef);
        }

        if (message || fileUrl) {
          await addDoc(collection(db, "groupChats", grade), {
            userId: currentUser,
            userName: `${user.firstName} ${user.lastName}`,
            message: message || "",
            fileUrl,
            timestamp: new Date().toISOString()
          });
          document.getElementById("group-chat-input").value = "";
          fileInput.value = "";
          showGroupChat();
        } else {
          alert("لطفاً پیام یا فایل وارد کنید!");
        }
      } catch (error) {
        console.error("Error sending group chat:", error.message);
        alert(`خطا در ارسال پیام: ${error.message}`);
      } finally {
        hideLoading();
      }
    });

    document.getElementById("view-group-chat-btn").addEventListener("click", showGroupChat);
    document.getElementById("back-to-grade-from-group-chat-btn").addEventListener("click", () => showSection("grade-section"));

    // Chat with coach
    document.getElementById("send-chat-btn").addEventListener("click", async () => {
      if (isAdmin) {
        alert("ادمین نمی‌تواند با مربی چت کند!");
        return;
      }
      showLoading();
      const chatInput = document.getElementById("chat-input").value.trim();
      if (!chatInput) {
        alert("لطفاً یک سؤال وارد کنید!");
        hideLoading();
        return;
      }
      try {
        const response = await getCoachResponse(chatInput);
        await addDoc(collection(db, "users", currentUser, "chatHistory"), {
          question: chatInput,
          response,
          timestamp: new Date().toISOString()
        });
        updateChatHistory();
        document.getElementById("chat-input").value = "";
      } catch (error) {
        console.error("Error saving chat:", error.message);
        alert(`خطا در ذخیره چت: ${error.message}`);
      } finally {
        hideLoading();
      }
    });

    async function updateChatHistory() {
      if (isAdmin) {
        alert("ادمین نمی‌تواند تاریخچه چت را مشاهده کند!");
        return;
      }
      showLoading();
      const chatHistoryDiv = document.getElementById("chat-history");
      chatHistoryDiv.innerHTML = "";
      try {
        const q = query(collection(db, "users", currentUser, "chatHistory"), orderBy("timestamp"));
        const snapshot = await getDocs(q);
        if (snapshot.empty) {
          chatHistoryDiv.innerHTML = "<p>هنوز گفتگویی ثبت نشده است.</p>";
        } else {
          snapshot.forEach(doc => {
            const chat = doc.data();
            chatHistoryDiv.innerHTML += `<div><strong>شما:</strong> ${chat.question}<br><strong>مربی:</strong> ${chat.response}<br><small>${chat.timestamp}</small><hr></div>`;
          });
        }
        showSection("chat-section");
      } catch (error) {
        console.error("Error loading chat history:", error.message);
        chatHistoryDiv.innerHTML = "<p>خطا در بارگذاری تاریخچه چت.</p>";
      } finally {
        hideLoading();
      }
    }

    document.getElementById("view-chat-btn").addEventListener("click", updateChatHistory);
    document.getElementById("back-to-grade-from-chat-btn").addEventListener("click", () => showSection("grade-section"));

    // Admin panel
    async function loadAdminPanel() {
      if (!isAdmin) {
        alert("فقط ادمین می‌تواند به پنل ادمین دسترسی داشته باشد!");
        return;
      }
      showLoading();
      try {
        const usersSnapshot = await getDocs(collection(db, "users"));
        const adminUsersDiv = document.getElementById("admin-users");
        adminUsersDiv.innerHTML = "";
        usersSnapshot.forEach(doc => {
          const user = doc.data();
          adminUsersDiv.innerHTML += `<p>${user.firstName} ${user.lastName} (${user.email}) - امتیاز: ${user.points || 0} <button class="delete-user-btn" data-uid="${doc.id}">حذف</button></p>`;
        });
        document.querySelectorAll(".delete-user-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const uid = btn.dataset.uid;
            if (confirm("آیا مطمئن هستید که می‌خواهید این کاربر را حذف کنید؟")) {
              await deleteDoc(doc(db, "users", uid));
              loadAdminPanel();
            }
          });
        });
        showSection("admin-panel-section");
      } catch (error) {
        console.error("Error loading admin panel:", error.message);
        alert("خطا در بارگذاری پنل ادمین");
      } finally {
        hideLoading();
      }
    }

    document.getElementById("add-mission-btn").addEventListener("click", async () => {
      if (!isAdmin) return;
      showLoading();
      const grade = document.getElementById("admin-grade-select").value;
      const chapterId = document.getElementById("admin-chapter-select").value;
      const question = document.getElementById("admin-mission-question").value.trim();
      const correctAnswer = document.getElementById("admin-mission-answer").value.trim();
      const options = document.getElementById("admin-mission-options").value.split(",").map(o => o.trim());
      const points = parseInt(document.getElementById("admin-mission-points").value);

      if (!question || !correctAnswer || options.length !== 4 || !options.includes(correctAnswer) || isNaN(points)) {
        alert("لطفاً تمام فیلدها را به درستی پر کنید!");
        hideLoading();
        return;
      }

      try {
        await addDoc(collection(db, "dailyMissions", grade, chapterId), {
          question,
          correctAnswer,
          options,
          topic: chapters[grade].find(c => c.id == chapterId).name,
          difficulty: 1,
          points,
          timestamp: new Date().toISOString()
        });
        alert("مأموریت روزانه با موفقیت اضافه شد!");
        document.getElementById("admin-mission-question").value = "";
        document.getElementById("admin-mission-answer").value = "";
        document.getElementById("admin-mission-options").value = "";
        document.getElementById("admin-mission-points").value = "";
      } catch (error) {
        console.error("Error adding mission:", error.message);
        alert(`خطا در افزودن مأموریت: ${error.message}`);
      } finally {
        hideLoading();
      }
    });

    document.getElementById("add-challenge-btn").addEventListener("click", async () => {
      if (!isAdmin) return;
      showLoading();
      const grade = document.getElementById("admin-grade-select").value;
      const chapterId = document.getElementById("admin-chapter-select").value;
      const question = document.getElementById("admin-challenge-question").value.trim();
      const correctAnswer = document.getElementById("admin-challenge-answer").value.trim();
      const options = document.getElementById("admin-challenge-options").value.split(",").map(o => o.trim());
      const points = parseInt(document.getElementById("admin-challenge-points").value);

      if (!question || !correctAnswer || options.length !== 4 || !options.includes(correctAnswer) || isNaN(points)) {
        alert("لطفاً تمام فیلدها را به درستی پر کنید!");
        hideLoading();
        return;
      }

      try {
        await addDoc(collection(db, "challenges", grade, chapterId), {
          question,
          correctAnswer,
          options,
          topic: chapters[grade].find(c => c.id == chapterId).name,
          difficulty: 3,
          points,
          timestamp: new Date().toISOString()
        });
        alert("چالش ویژه با موفقیت اضافه شد!");
        document.getElementById("admin-challenge-question").value = "";
        document.getElementById("admin-challenge-answer").value = "";
        document.getElementById("admin-challenge-options").value = "";
        document.getElementById("admin-challenge-points").value = "";
      } catch (error) {
        console.error("Error adding challenge:", error.message);
        alert(`خطا در افزودن چالش: ${error.message}`);
      } finally {
        hideLoading();
      }
    });

    document.getElementById("view-admin-panel-btn").addEventListener("click", loadAdminPanel);
    document.getElementById("back-to-grade-from-admin-btn").addEventListener("click", () => showSection("admin-panel-section"));

    // Initialize
    document.getElementById("grade-select").dispatchEvent(new Event("change"));
    document.getElementById("admin-grade-select").dispatchEvent(new Event("change"));
  </script>
