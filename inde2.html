<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ماشین حساب علمی</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      padding: 20px;
      direction: rtl;
      background-color: #f5f5f5;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 10px;
      width: 90%;
      max-width: 400px;
      font-size: 16px;
      margin-bottom: 10px;
      direction: ltr;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 5px;
      max-width: 400px;
      margin: 10px auto;
    }

    .btn {
      padding: 10px;
      font-size: 16px;
      background-color: #e0e0e0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button.action {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    #history {
      margin-top: 30px;
      text-align: right;
      width: 95%;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    #history h3 {
      margin-top: 0;
      font-size: 18px;
    }

    .history-item {
      margin: 5px 0;
      font-family: monospace;
    }

    @media (max-width: 600px) {
      .btn {
        font-size: 14px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <h1>ماشین حساب علمی</h1>

  <input type="text" id="expression" placeholder="عبارت را وارد کنید..." />

  <div class="button-grid">
    <!-- اعداد -->
    <button class="btn" onclick="insert('7')">7</button>
    <button class="btn" onclick="insert('8')">8</button>
    <button class="btn" onclick="insert('9')">9</button>
    <button class="btn" onclick="insert('/')">÷</button>

    <button class="btn" onclick="insert('4')">4</button>
    <button class="btn" onclick="insert('5')">5</button>
    <button class="btn" onclick="insert('6')">6</button>
    <button class="btn" onclick="insert('*')">×</button>

    <button class="btn" onclick="insert('1')">1</button>
    <button class="btn" onclick="insert('2')">2</button>
    <button class="btn" onclick="insert('3')">3</button>
    <button class="btn" onclick="insert('-')">−</button>

    <button class="btn" onclick="insert('0')">0</button>
    <button class="btn" onclick="insert('.')">.</button>
    <button class="btn" onclick="insert('+')">+</button>
    <button class="btn" onclick="insert('^')">^</button>

    <!-- توابع -->
    <button class="btn" onclick="insert('(')">(</button>
    <button class="btn" onclick="insert(')')">)</button>
    <button class="btn" onclick="insert('√(')">√</button>
    <button class="btn" onclick="insert('π')">π</button>

    <button class="btn" onclick="insert('e')">e</button>
    <button class="btn" onclick="insert('sin(')">sin</button>
    <button class="btn" onclick="insert('cos(')">cos</button>
    <button class="btn" onclick="insert('tan(')">tan</button>

    <button class="btn" onclick="insert('log(')">log</button>
  </div>

  <div>
    <button class="action" onclick="calculate()">محاسبه</button>
    <button class="btn" onclick="clearHistory()">پاک‌کردن تاریخچه</button>
  </div>

  <div id="result"></div>

  <div id="history">
    <h3>تاریخچه:</h3>
    <div id="history-list"></div>
  </div>

  <script>
    let historyList = JSON.parse(localStorage.getItem("calcHistory")) || [];

    function insert(text) {
      const input = document.getElementById('expression');
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const current = input.value;
      input.value = current.substring(0, start) + text + current.substring(end);
      input.focus();
      input.selectionStart = input.selectionEnd = start + text.length;
    }

    function calculate() {
      let input = document.getElementById('expression').value;

      try {
        input = input.replace(/√/g, 'sqrt');
        input = input.replace(/\^/g, '**');
        input = input.replace(/π/g, 'Math.PI');
        input = input.replace(/\be\b/g, 'Math.E');

        input = input.replace(/\bsqrt\(/g, 'Math.sqrt(');
        input = input.replace(/\bsin\(/g, 'Math.sin(toRadians(');
        input = input.replace(/\bcos\(/g, 'Math.cos(toRadians(');
        input = input.replace(/\btan\(/g, 'Math.tan(toRadians(');
        input = input.replace(/\blog\(/g, 'Math.log10(');

        const result = eval(input);
        document.getElementById('result').innerText = `نتیجه: ${result}`;

        const item = `${document.getElementById('expression').value} = ${result}`;
        historyList.unshift(item);
        saveHistory();
        updateHistory();
      } catch (e) {
        document.getElementById('result').innerText = 'خطا در محاسبه!';
      }
    }

    function toRadians(deg) {
      return deg * (Math.PI / 180);
    }

    function updateHistory() {
      const historyDiv = document.getElementById('history-list');
      historyDiv.innerHTML = '';
      historyList.slice(0, 20).forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerText = item;
        historyDiv.appendChild(div);
      });
    }

    function saveHistory() {
      localStorage.setItem("calcHistory", JSON.stringify(historyList));
    }

    function clearHistory() {
      historyList = [];
      localStorage.removeItem("calcHistory");
      updateHistory();
      document.getElementById('result').innerText = '';
    }

    updateHistory();
  </script>
</body>
</html>
